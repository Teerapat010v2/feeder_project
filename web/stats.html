<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สถิติการใช้งาน - Fish Feeder</title>
    <link rel="stylesheet" href="web/style.css">
    <!-- ดึง Chart.js สำหรับวาดกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
        <h1>📊 สถิติและการใช้อาหารปลา</h1>

        <!-- 📈 การ์ดสรุปยอดภาพรวม -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <div class="card" style="text-align: center;">
                <h4 style="margin: 0; color: #666;">วันนี้ให้อาหารไป</h4>
                <p style="font-size: 24px; font-weight: bold; color: #007bff; margin: 10px 0 0 0;"><span id="todayTotal">0</span> g</p>
            </div>
            <div class="card" style="text-align: center;">
                <h4 style="margin: 0; color: #666;">เฉลี่ยต่อวัน</h4>
                <p style="font-size: 24px; font-weight: bold; color: #28a745; margin: 10px 0 0 0;"><span id="avgDaily">0</span> g</p>
            </div>
            <div class="card" style="text-align: center;">
                <h4 style="margin: 0; color: #666;">รวมในสัปดาห์นี้</h4>
                <p style="font-size: 24px; font-weight: bold; color: #ffc107; margin: 10px 0 0 0;"><span id="weeklyTotal">0</span> g</p>
            </div>
        </div>

        <!-- 📊 กราฟแท่งแสดงปริมาณอาหารรายวัน -->
        <div class="card">
            <h3>📉 แนวโน้มการใช้อาหาร (7 วันล่าสุด)</h3>
            <canvas id="feedChart" width="400" height="220"></canvas>
        </div>

        <!-- 📋 ตารางสรุปยอดประจำวัน -->
        <div class="card" style="margin-top: 20px;">
            <h3>📅 สรุปยอดรวมรายวัน</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>จำนวนครั้ง</th>
                        <th>ปริมาณรวม (กรัม)</th>
                    </tr>
                </thead>
                <tbody id="dailySummaryTable">
                    <!-- ข้อมูลจะถูกสร้างผ่าน JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- สคริปต์วาดกราฟตัวอย่าง -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const ctx = document.getElementById('feedChart').getContext('2d');
            
            // กราฟตัวอย่าง (สามารถเขียน JS ใน app.js ดึงข้อมูลจริงจาก Firebase มาใส่แทนได้)
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์', 'เสาร์', 'อาทิตย์'],
                    datasets: [{
                        label: 'ปริมาณอาหาร (กรัม)',
                        data: [30, 45, 40, 50, 35, 60, 40],
                        backgroundColor: 'rgba(0, 123, 255, 0.6)',
                        borderColor: 'rgba(0, 123, 255, 1)',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        });
    </script>
    <script src="web/app.js"></script>
</body>
</html>
