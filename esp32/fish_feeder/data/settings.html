<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าอุปกรณ์ - Fish Feeder</title>
    <link rel="stylesheet" href="/style.css?v=3.13">
    <link rel="icon" href="data:,">
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="top-bar">
        <div class="top-bar-left">
            <button id="hamburgerBtn" class="btn-icon" aria-label="Open Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="brand-logo">
                <img src="/image/logo-iot.png" alt="Logo" class="top-logo">
                <span class="brand-title">Fish Feeder</span>
            </div>
        </div>
        <div class="top-bar-right">
            <span id="connectionStatus" class="status-badge online">● Online</span>
        </div>
    </header>

    <!-- LEFT SIDEBAR DRAWER -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebarDrawer" class="sidebar-drawer">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <img src="/image/logo-iot.png" alt="Logo" class="sidebar-logo">
                <span>Fish Feeder</span>
            </div>
            <button id="closeSidebarBtn" class="btn-icon-sm">&times;</button>
        </div>
        <nav class="sidebar-menu">
            <a href="index.html" class="menu-item">หน้าหลัก</a>
            <a href="schedule.html" class="menu-item">ตั้งเวลาให้อาหาร</a>
            <a href="history.html" class="menu-item">ประวัติการทำงาน</a>
            <a href="settings.html" class="menu-item active">ตั้งค่าอุปกรณ์</a>
        </nav>
        <div class="sidebar-footer">
            โครงงานนักศึกษาของมหาวิทยาลัยราชภัฏบุรีรัมย์<br>สาขาเทคโนโลยีสารสนเทศ ปี 2569
        </div>
    </aside>

    <!-- MAIN CONTAINER -->
    <main class="container">
        
        <!-- ข้อมูลรหัสประจำเครื่อง -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header-title">รหัสประจำเครื่อง (Device ID)</div>
            <div class="input-group">
                <label for="deviceIdInput">ไอดีเครื่อง:</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="deviceIdInput" value="Prototype_01" readonly style="background-color: var(--bg-color); color: var(--text-muted); font-weight: bold; cursor: not-allowed;">
                </div>
                
            </div>
        </div>

        <!-- แท็บสลับหน้าการตั้งค่า -->
        <div class="mode-selector">
            <button id="tabApBtn" class="btn-mode active">WiFi ของเครื่อง (Device AP)</button>
            <button id="tabHomeBtn" class="btn-mode">WiFi บ้าน (Home WiFi)</button>
        </div>

        <!-- 1.1 ตั้งค่า WiFi ของเครื่อง (Device AP) -->
        <section id="section-ap-settings" class="page-section">
            <div class="card">
                <div class="card-header-title">ตั้งค่า WiFi ของเครื่อง (Device AP)</div>
                
                <div class="input-group">
                    <label for="apSsidInput">ชื่อ WiFi ของเครื่อง (SSID):</label>
                    <input type="text" id="apSsidInput" placeholder="เช่น FishFeeder-AP">
                </div>

                <div class="input-group">
                    <label for="apPasswordInput">รหัสผ่าน WiFi ของเครื่อง:</label>
                    <input type="password" id="apPasswordInput" placeholder="อย่างน้อย 8 ตัวอักษร">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 14px;">
                    <button id="saveApBtn" class="btn-primary" style="flex: 1;">บันทึกชื่อ/รหัสผ่านเครื่อง</button>
                    <button id="resetApBtn" class="btn-danger" style="width: auto; padding: 0 16px;">รีเซ็ตค่าเริ่มต้นของเครื่อง</button>
                </div>
            </div>
        </section>

        <!-- 1.2 ตั้งค่า WiFi ที่จะให้เครื่องเชื่อมต่อ (Home WiFi) -->
        <section id="section-home-settings" class="page-section" style="display: none;">
            <div class="card">
                <div class="card-header-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>ตั้งค่า WiFi ที่จะให้เครื่องเชื่อมต่อ (Home WiFi)</span>
                </div>

                <div class="input-group" style="margin-top: 12px;">
                    <label for="homeSsidInput">SSID WiFi บ้าน:</label>
                    <input type="text" id="homeSsidInput" placeholder="พิมพ์ชื่อ WiFi">
                </div>

                <div class="input-group">
                    <label for="homePasswordInput">รหัสผ่าน WiFi บ้าน:</label>
                    <input type="password" id="homePasswordInput" placeholder="กรอกรหัสผ่าน WiFi บ้าน">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 14px;">
                    <button id="connectWifiBtn" class="btn-primary" style="flex: 1;">บันทึก / เชื่อมต่อ</button>
                    <button id="forgetWifiBtn" class="btn-danger" style="width: auto; padding: 0 16px;">ลืมเครือข่ายนี้</button>
                </div>
            </div>
        </section>

    </main>

    <script>
        if (window.location.hostname !== "192.168.4.1" && !window.location.hostname.startsWith("192.168.")) {
            document.write('<script src="/mqtt.min.js"><\\/script>');
        }
    </script>
    <script type="module" src="/app.js?v=3.13"></script>
</body>
</html>
