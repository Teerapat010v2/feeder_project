<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Feeder Dashboard</title>
    <link rel="stylesheet" href="web/style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="container">
        <h1>🐟 Fish Feeder Dashboard</h1>

        <!-- 🔘 ปุ่มเลือกโหมด -->
        <div class="mode-selector">
            <button id="btn-cloud" class="btn-mode active" onclick="setControlMode('cloud')">☁️ Cloud Mode</button>
            <button id="btn-local" class="btn-mode" onclick="setControlMode('local')">🏠 Local Mode</button>
        </div>

        <!-- 🌐 ช่องกรอก IP สำหรับ Local Mode (ซ่อนไว้ก่อน) -->
        <div id="local-ip-group" class="input-group" style="display: none;">
            <label for="esp-ip">IP Address ของบอร์ด ESP8266:</label>
            <input type="text" id="esp-ip" placeholder="เช่น 192.168.1.150" value="192.168.1.150">
        </div>

        <!-- 🐟 ปุ่มสั่งให้อาหาร -->
        <div class="action-section">
            <button id="feedBtn" class="...">สั่งให้อาหาร</button>
        </div>
    </div>

    <script src="web/app.js"></script>
</body>
</html>
